name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma generate (this project's own postinstall script) only needs
      # DATABASE_URL to be a syntactically valid connection string at schema-
      # load time — it never actually connects. No real database, and no
      # repo secret, is needed to run lint/typecheck/tests in CI.
      DATABASE_URL: "postgresql://user:password@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        # Confirmed locally (Day 37) that `next build` succeeds with nothing
        # but this same placeholder DATABASE_URL set — every route that
        # touches Sanity/AI/auth config is server-rendered on demand, not
        # statically prerendered, so none of those env vars are read until a
        # real request comes in. `prisma migrate deploy` (the DB-touching
        # half of the real production build, see vercel.json) is
        # deliberately *not* run here — this step exists to catch a
        # build-breaking code error, not to validate a deploy.
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
